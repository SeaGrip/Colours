<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SeaGrip Available Colours</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: brand header, legend, colour cards grouped by sheet type (layer cross-section + Available / Out of stock) */
:root{
  --logo-filter:none; --bg:#eef1f3; --panel:#ffffff; --ink:#15212b; --muted:#5b6872; --line:#d5dbe0;
  --ok:#1f7a4d; --ok-soft:#dff2e8; --bad:#b3261e; --bad-soft:#f9dedb;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --logo-filter:invert(1); --bg:#0f161c; --panel:#18222b; --ink:#e6edf2; --muted:#9aa8b3; --line:#2a3743;
  --ok:#6fd3a0; --ok-soft:#173a2a; --bad:#ff8a80; --bad-soft:#47201d; color-scheme:dark }}
:root[data-theme="dark"]{
  --logo-filter:invert(1); --bg:#0f161c; --panel:#18222b; --ink:#e6edf2; --muted:#9aa8b3; --line:#2a3743;
  --ok:#6fd3a0; --ok-soft:#173a2a; --bad:#ff8a80; --bad-soft:#47201d; color-scheme:dark }
.logo{display:block;width:auto;max-width:100%;filter:var(--logo-filter)}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 40px;display:flex;flex-direction:column;gap:20px}
.brand{font-family:var(--f-display);font-weight:700;font-size:30px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:13px;letter-spacing:.08em;color:var(--muted);margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.d-ok{background:var(--ok)} .d-out{background:var(--bad)}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px;display:flex;gap:10px;align-items:baseline}
h2 span{font-family:var(--f-body);font-size:13px;color:var(--muted);text-transform:none;letter-spacing:.02em;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;min-width:0}
.card.out{opacity:.72}
.layers{width:40px;height:52px;flex:none;display:flex;flex-direction:column;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.layers i{flex:1;display:block}
.name{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1;flex:1;min-width:0;overflow-wrap:anywhere}
.pill{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:4px 10px;white-space:nowrap}
.s-ok{background:var(--ok-soft);color:var(--ok)} .s-out{background:var(--bad-soft);color:var(--bad)}
.foot{font-size:13px;color:var(--muted)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
</style>

</head>
